name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write       # required for the gh-release step

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        # Capacitor 8 CLI requires Node >= 22 (the install fails with a
        # fatal log otherwise).
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: guest-app/package-lock.json

      - name: Setup JDK 21
        # Capacitor 8 / AGP 8.7+ requires JDK 21 — compileDebugJavaWithJavac
        # fails with `invalid source release: 21` on JDK 17.
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        working-directory: guest-app
        run: npm ci

      - name: Build web bundle
        working-directory: guest-app
        run: npm run build:dev

      - name: Sync Capacitor android
        working-directory: guest-app
        run: npx cap sync android

      - name: Make gradlew executable
        working-directory: guest-app/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: guest-app/android
        # pipefail so a gradle failure isn't masked by tee's exit code
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: centersai-guest-debug
          path: guest-app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 60

      - name: Publish to GitHub Release (rolling "latest")
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "MOTOGIATHINH Cộng tác viên · latest debug build"
          body: |
            Automated debug APK from commit `${{ github.sha }}`.

            ## Install
            1. **Tap the .apk file below** on your phone to download.
            2. Allow your browser to install unknown apps (one-time per browser).
               Settings → Apps → Special access → Install unknown apps.
            3. Tap **Install** → **Open**.

            ## First-run checklist
            - This build calls the **LAN dev backend** at `http://DESKTOP-L0C7R5A.local:3001`.
              The backend must be running, Windows Firewall must allow TCP 3001
              inbound, and the phone must be on the same Wi-Fi.
            - Verify by opening `http://DESKTOP-L0C7R5A.local:3001/api/health` in your
              phone's browser first — should return `{"ok":true,...}`.

            ## Login
            - `viet@motogiathinh.centersai` / `viet`
            - (also seeded: `tuan` / `thaianh` / `tannhan`)

            ## Smoke test (~2 min)
            1. Login screen appears with SF Pro fonts.
            2. Tap **Thêm học viên** → modal opens.
            3. Tap **CCCD mặt trước** → native OS sheet appears with
               "Chụp ảnh mới" / "Chọn từ thư viện" / "Hủy".
            4. Fill Họ tên + SĐT → tap **Lưu học viên** → student created.
          files: guest-app/android/app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: true
          prerelease: true
