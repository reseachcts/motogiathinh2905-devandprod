name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: guest-app/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        working-directory: guest-app
        run: npm ci

      - name: Build web bundle
        working-directory: guest-app
        run: npm run build:dev

      - name: Diagnose pre-sync state
        working-directory: guest-app
        if: always()
        run: |
          echo "=== pwd ==="
          pwd
          echo "=== dist/ exists? ==="
          ls -la dist/ | head -20 || echo "NO DIST"
          echo "=== capacitor.config.json ==="
          cat capacitor.config.json
          echo "=== android/ top level ==="
          ls -la android/ | head -20
          echo "=== node_modules/@capacitor ==="
          ls node_modules/@capacitor/ || true
          echo "=== npx cap --version ==="
          npx cap --version || true

      - name: Sync Capacitor android (verbose + captured)
        working-directory: guest-app
        run: |
          set +e
          npx cap sync android --verbose 2>&1 | tee /tmp/cap-sync.log
          STATUS=$?
          echo "===== exit status: $STATUS ====="
          if [ $STATUS -ne 0 ]; then
            echo "::error::cap sync failed with status $STATUS"
            cat /tmp/cap-sync.log
            exit $STATUS
          fi

      - name: Upload cap-sync log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cap-sync-log
          path: /tmp/cap-sync.log
          if-no-files-found: warn

      - name: Make gradlew executable
        working-directory: guest-app/android
        run: chmod +x gradlew

      - name: Build debug APK (verbose + captured)
        working-directory: guest-app/android
        run: |
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace --info 2>&1 | tee /tmp/gradle.log
          STATUS=$?
          echo "===== gradle exit: $STATUS ====="
          if [ $STATUS -ne 0 ]; then
            echo "::error::gradle assembleDebug failed"
            echo "--- tail of gradle.log ---"
            tail -200 /tmp/gradle.log
            exit $STATUS
          fi

      - name: Upload gradle log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: /tmp/gradle.log
          if-no-files-found: warn

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: centersai-guest-debug
          path: guest-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 60

      - name: Publish to GitHub Release (rolling "latest")
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "MOTOGIATHINH Cộng tác viên · latest build"
          body: |
            Automated debug APK from commit `${{ github.sha }}`.

            **Install:**
            1. Tap the `.apk` file below on your phone.
            2. Allow your browser to install unknown apps (one-time per browser).
            3. Tap Install → Open.

            **First-run checklist:**
            - Backend reachable on the phone's Wi-Fi: open `http://192.168.1.6:3001/api/health` in your phone's browser first.
            - Login: `viet@motogiathinh.centersai` / `viet` (also: tuan / thaianh / tannhan).
          files: guest-app/android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
          prerelease: true
