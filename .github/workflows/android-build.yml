name: Build Android APK

# Auto-build the guest-app debug APK whenever guest-app/ or this workflow
# changes on main. Attaches the APK to a tagged GitHub Release so a
# coworker can download + sideload it on their phone without any local
# dev setup.

on:
  push:
    branches: [main]
    paths:
      - 'guest-app/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:    # manual "Run workflow" button in the Actions UI

permissions:
  contents: write       # required to create the GitHub Release

jobs:
  build:
    name: Build debug APK (LAN backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: guest-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: guest-app/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install npm dependencies
        run: npm ci

      - name: Build web bundle (development env — points at LAN backend)
        run: npm run build:dev
        # Edit guest-app/.env.production + change this to `npm run build`
        # once the HTTPS backend is deployed.

      - name: Sync Capacitor → android/
        run: npx cap sync android

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('guest-app/android/**/*.gradle*', 'guest-app/android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: guest-app/android

      - name: Rename APK with commit SHA
        run: |
          mkdir -p ../artifacts
          SHORT_SHA="${GITHUB_SHA::7}"
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             ../artifacts/centersai-guest-${SHORT_SHA}.apk
          ls -lh ../artifacts/

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: centersai-guest-apk
          path: artifacts/*.apk
          retention-days: 60
          if-no-files-found: error

      - name: Publish to GitHub Release (tag: latest)
        # The tag is reused on every successful build — the latest APK is
        # always at /releases/latest. Older releases are kept tagged by
        # commit SHA below.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "MOTOGIATHINH guest · latest debug build"
          body: |
            Automated debug build from commit `${{ github.sha }}`.
            Branch: `${{ github.ref_name }}`
            Built: `${{ github.event.head_commit.timestamp }}`

            ## Install on Android
            1. **Tap the .apk file below** on your phone to download.
            2. When prompted, allow your browser to install unknown apps
               (Settings → Apps → Special access → Install unknown apps).
            3. Tap **Install**, then **Open**.

            ## First-run checklist
            - Login: `viet@motogiathinh.centersai` / `viet`
              (also seeded: tuan / thaianh / tannhan)
            - This build calls the **LAN dev backend** at
              `http://192.168.1.6:3001`. The backend must be running, the
              Windows Firewall must allow TCP 3001 inbound, and the
              phone must be on the same Wi-Fi.
            - Verify by opening `http://192.168.1.6:3001/api/health`
              in the phone's browser first — should return `{"ok":true,…}`.

            ## Smoke test (~2 min)
            1. Login screen appears with SF Pro fonts.
            2. After login, your name + student count chip render.
            3. Tap **Thêm học viên** → modal opens.
            4. Tap **CCCD mặt trước** → native OS sheet appears with
               "Chụp ảnh mới" / "Chọn từ thư viện" / "Hủy". Pick one.
            5. Fill Họ tên + SĐT, tap **Lưu học viên** → student is created.

            Fonts, glass effects, neon accents and dark theme should match
            the web version pixel-for-pixel.
          files: artifacts/*.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: true

      - name: Also publish a permanent per-commit release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.sha }}
          name: "Build ${{ github.sha }}"
          body: |
            Permanent per-commit build. The rolling latest tag is at
            [/releases/latest](../../releases/latest).
          files: artifacts/*.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: true
