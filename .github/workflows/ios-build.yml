name: Build iOS IPA (unsigned)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write       # required for the gh-release steps

jobs:
  build:
    # macos-15 = Sequoia; ships Xcode 16 / Swift 6. Capacitor 8's camera native
    # lib (ion-ios-camera) uses Swift 6 language features — Xcode 15.4 on
    # macos-14 fails to compile it (~72 errors/file, cascading into spurious
    # CameraPlugin "no member viewController" errors). Xcode 16 compiles it.
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        # Capacitor 8 CLI requires Node >= 22.
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: guest-app/package-lock.json

      - name: Install dependencies
        working-directory: guest-app
        run: npm ci

      - name: Build web bundle (LAN dev backend)
        working-directory: guest-app
        # build:dev bakes in the LAN backend URL from .env.development so the
        # sideloaded IPA talks to the dev box on the same Wi-Fi.
        run: npm run build:dev

      - name: Add iOS platform (idempotent)
        working-directory: guest-app
        shell: bash
        # Fresh runner has no ios/ folder, so cap add generates it. If a future
        # checkout commits ios/, swallow the "already exists" and let sync work.
        run: npx cap add ios || echo "ios platform already present, continuing"

      - name: Sync Capacitor iOS
        working-directory: guest-app
        run: npx cap sync ios

      - name: Configure iOS security (ATS + privacy usage strings)
        working-directory: guest-app
        shell: bash
        # This is a Capacitor WKWebView app talking to a plain-HTTP LAN backend.
        # We do NOT disable App Transport Security globally (NSAllowsArbitraryLoads).
        # Instead ATS stays enforced for the public internet and we scope the
        # exceptions to exactly what the LAN debug build needs:
        #   - NSAllowsArbitraryLoadsInWebContent: the app's fetch() runs inside
        #     the WKWebView, so this is what actually lets it reach http://<LAN>.
        #   - NSAllowsLocalNetworking: permits private-range / local hosts.
        # Plus the privacy usage strings iOS REQUIRES — without them the app
        # hard-crashes the instant the CCCD photo picker / camera is opened.
        run: |
          set -euo pipefail
          PLIST="ios/App/App/Info.plist"
          PB=/usr/libexec/PlistBuddy
          # App Transport Security (scoped) — rebuild the dict cleanly.
          $PB -c "Delete :NSAppTransportSecurity" "$PLIST" 2>/dev/null || true
          $PB -c "Add :NSAppTransportSecurity dict" "$PLIST"
          $PB -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoadsInWebContent bool true" "$PLIST"
          $PB -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$PLIST"
          # Privacy usage descriptions (Vietnamese, matches the in-app UX).
          set_str() { $PB -c "Add :$1 string $2" "$PLIST" 2>/dev/null || $PB -c "Set :$1 $2" "$PLIST"; }
          set_str NSCameraUsageDescription "Ứng dụng cần máy ảnh để chụp ảnh CCCD và chân dung học viên."
          set_str NSPhotoLibraryUsageDescription "Ứng dụng cần truy cập thư viện ảnh để chọn ảnh CCCD và chân dung học viên."
          echo "----- Info.plist after patch -----"
          $PB -c "Print" "$PLIST"

      - name: Resolve SPM package dependencies
        # Capacitor 8 uses Swift Package Manager (no CocoaPods / no .xcworkspace).
        # Run resolve explicitly so a dependency failure surfaces here.
        working-directory: guest-app/ios/App
        run: xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App

      - name: Build unsigned .app via xcodebuild
        working-directory: guest-app/ios/App
        shell: bash
        # pipefail so an xcodebuild failure isn't masked by tee. Tee to a log
        # the failure step attaches to a ci-debug-ios release.
        run: |
          set -o pipefail
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -derivedDataPath build \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build 2>&1 | tee xcodebuild.log

      - name: Repackage .app into unsigned .ipa
        working-directory: guest-app/ios/App
        shell: bash
        # IPA = zip of Payload/<AppName>.app. No signing — Sideloadly signs on
        # the user's Windows box with their free Apple ID cert.
        run: |
          set -euo pipefail
          mkdir -p Payload
          cp -r build/Build/Products/Debug-iphoneos/App.app Payload/
          zip -r ../../app-debug-ios.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: centersai-guest-debug-ios
          path: guest-app/app-debug-ios.ipa
          if-no-files-found: error
          retention-days: 60

      - name: Publish xcodebuild log on failure (ci-debug-ios)
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-debug-ios
          name: "iOS CI diagnostic log"
          body: |
            xcodebuild failed on commit `${{ github.sha }}`.
            Download `xcodebuild.log` below for the full output.
          files: guest-app/ios/App/xcodebuild.log
          fail_on_unmatched_files: false
          prerelease: true

      - name: Publish to GitHub Release (rolling "latest-ios")
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-ios
          name: "MOTOGIATHINH Cộng tác viên · latest iOS debug build"
          body: |
            Automated **unsigned** debug IPA from commit `${{ github.sha }}`.

            ## Install (Windows → iPhone via Sideloadly)
            1. **Download `app-debug-ios.ipa`** below to your Windows PC.
            2. Install **Sideloadly** from <https://sideloadly.io> (free).
            3. Plug your iPhone in via USB, trust the computer.
            4. Open Sideloadly, drag the `.ipa` onto it.
            5. Enter your **Apple ID** (a free account works). Sideloadly
               re-signs locally with a 7-day personal provisioning profile.
            6. Click **Start**, then on the iPhone: Settings → General →
               VPN & Device Management → trust your Apple ID profile.
            7. Launch **App** from the home screen.

            ## ⚠️ 7-day expiry
            Free Apple ID certs expire after **7 days**. When the app stops
            launching, re-run Sideloadly with the same IPA to refresh.

            ## First-run checklist
            - This build calls the **LAN dev backend** at `http://DESKTOP-L0C7R5A.local:3001`.
              The backend must be running, Windows Firewall must allow TCP 3001
              inbound, and the iPhone must be on the same Wi-Fi.
            - App Transport Security is configured for LAN HTTP
              (NSAllowsArbitraryLoadsInWebContent + NSAllowsLocalNetworking), so
              the plain-HTTP backend is reachable while ATS stays on for the
              public internet.
            - Verify by opening `http://DESKTOP-L0C7R5A.local:3001/api/health` in Safari on
              the iPhone first — should return `{"ok":true,...}`.

            ## Login
            - `viet@motogiathinh.centersai` / `viet`
            - (also seeded: `tuan` / `thaianh` / `tannhan`)

            ## Smoke test (~2 min)
            1. Login screen appears with SF Pro fonts.
            2. Tap **Thêm học viên** → modal opens.
            3. Tap **CCCD mặt trước** → native iOS sheet appears with
               "Chụp ảnh mới" / "Chọn từ thư viện" / "Hủy".
            4. Fill Họ tên + SĐT → tap **Lưu học viên** → student created.
          files: guest-app/app-debug-ios.ipa
          fail_on_unmatched_files: true
          prerelease: true
